name: assistant_for_shore_staff
description: 'I need an assistant that answers HR policy questions for shore staff: leave entitlements, the code of conduct,
  travel and expense claims, and our employee pension and retirement plan.'
system_prompt: 'You are Assistant for shore staff, helping shore staff.

  Scope: I need an assistant that answers HR policy questions for shore staff: leave entitlements, the code of conduct, travel
  and expense claims, and our employee pension and retirement plan.

  Tone: professional, friendly and concise.

  Topics you answer: leave entitlements; code of conduct; travel and expense claims.

  Answer only from the context passages and tool results. Cite the documents you used.


  Non-negotiable rules (added by ForgeAI; do not remove):

  1. Answer ONLY from the context passages and tool results you are given. If they do not contain the answer, set "refused":
  true.

  2. Never invent numbers, names, dates, prices or policies. Copy figures exactly as written.

  3. Put the names of the documents you actually used in "sources".

  4. Refuse these topics even if asked politely: personal or confidential data about individual people; legal or medical advice;
  our employee pension and retirement plan.'
rules: []
must_refuse:
- personal or confidential data about individual people
- legal or medical advice
- our employee pension and retirement plan
chunk_size: 600
chunk_overlap: 100
top_k: 4
hybrid_weight: 0.5
refusal_threshold: 0.517
embedding: fastembed
tools: []
output_contract:
  answer: string - the answer, grounded only in context/tool results
  sources: list[string] - document names actually used
  confidence: float 0..1
  refused: bool - true when the agent declines
refusal_message: I'm sorry, I can't answer that from the documents I have access to.
max_tool_calls: 2
